<!--
Sumry v7: personal document quick-guide PWA (no build step).

Upload these files together into the same GitHub Pages folder:
  index.html, sw.js, manifest.webmanifest, icon-192.png, icon-512.png, icon-maskable-512.png, apple-touch-icon.png

SETUP (once):
1. Firebase console > Authentication > enable Google. Add your GitHub Pages domain under Authorized domains.
2. Firestore Database > create in asia-south1 > Rules:
     rules_version = '2';
     service cloud.firestore { match /databases/{db}/documents {
       match /users/{uid}/{doc=**} { allow read, write: if request.auth != null && request.auth.uid == uid; }
     }}
3. Project settings > Your apps > Web > paste the config values into FIREBASE_CONFIG below.
Until apiKey is filled in, the app runs in local demo mode (data stays in this browser only).

Offline: open the app once online. sw.js then keeps the app (and the Firebase scripts) on the device.
When you change index.html, bump CACHE in sw.js so phones pick up the new version.
-->

  --shadow:0 14px 38px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.30);
  --mark:238,220,118;--mk1:.96;--mk2:.84;--mk3:.94;--tabbg:rgba(14,30,41,.90);--markink:#06141b;--amber:#f2b866;--red:#ff9a8f;--amberbg:rgba(242,184,102,.16);--redbg:rgba(255,154,143,.16);
  --inkglass:#ccd0cf;--onink:#06141b;--btnshadow:0 10px 26px rgba(0,0,0,.45);
  --g1:rgba(155,168,171,.36);--g2:rgba(37,55,69,.70);--g3:rgba(74,92,106,.30)
}
*{box-sizing:border-box;margin:0}
html{background:var(--paper)}
body{font:16px/1.45 "Atkinson",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(520px 420px at 0% 0%,var(--g1),transparent 70%),
  radial-gradient(480px 420px at 100% 32%,var(--g3),transparent 70%),
  radial-gradient(540px 460px at 70% 100%,var(--g2),transparent 70%)}
:root[data-theme=midnight] body::before{background:
  radial-gradient(760px 580px at -8% -6%,var(--g1),transparent 66%),
  radial-gradient(520px 520px at 108% 104%,var(--g2),transparent 70%),
  radial-gradient(460px 420px at 100% 30%,var(--g3),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
button,a,summary,[data-a],label{touch-action:manipulation}
a{color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 22px 150px}

/* sticky glass bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;margin:0 -22px;padding:max(8px,env(safe-area-inset-top)) 22px 8px;
  background:transparent;border-bottom:1px solid transparent;transition:background-color .2s,border-color .2s}
body.scrolled .bar{background:var(--paperA);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border-bottom-color:var(--rule);box-shadow:0 6px 24px rgba(0,0,0,.06)}
.bar-r{display:flex;align-items:center;gap:8px}

/* glass surfaces */
.panel,.act,.back,.round,.chip,.note,.stat,.inp,.cat,.pin,.tabs,.seg,.tool{
  background:var(--sheet);background-image:linear-gradient(145deg,var(--sheen),rgba(255,255,255,0) 62%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--hl),inset 0 -1px 0 rgba(0,0,0,.04)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.act,.back,.round,.chip,.note,.stat,.inp,.cat,.pin,.tabs,.seg,.tool{background:var(--sheet2)}}

/* type */
h1.title{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:8px 0 0}
h1.title.sm{font-size:30px}
.sub{color:var(--graphite);font-size:15px;margin-top:6px}
.lbl{font-size:14px;font-weight:700;color:var(--graphite);margin:30px 0 4px}
.lbl.bad{color:var(--red)}
small:empty{display:none}
.mono{font-variant-numeric:tabular-nums}

/* chrome */
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 16px 0 10px;border-radius:99px;font-weight:700;font-size:15px}
.back svg,.round svg,.tool svg,.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;text-align:center;flex:none}
.round.on{background:var(--inkglass);color:var(--onink);border-color:transparent}
.stat{padding:7px 12px;border-radius:99px;font-size:14px;font-weight:700;color:var(--graphite);white-space:nowrap}
.stat.amber{background:var(--amberbg);color:var(--amber)}
.stat.bad{background:var(--redbg);color:var(--red)}
.note.move .btn{margin-top:12px;height:48px}
.note{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:13px;color:var(--amber)}
.search{position:relative;margin-top:16px}
.search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--graphite);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.inp{width:100%;height:48px;padding:0 16px;border-radius:14px;color:var(--ink);font:inherit;background:var(--sheet2);-webkit-appearance:none;appearance:none}
.inp::placeholder{color:var(--graphite)}
.inp:focus{outline:none;border-color:var(--ink)}
textarea.inp{height:auto;padding:14px 16px;line-height:1.5}
.area{min-height:170px;resize:vertical;font-size:16px}
.search .inp{border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 0 0 28px}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:12px 22px 22px;margin:0 -22px -14px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchips .chip{flex:none;white-space:nowrap;-webkit-backdrop-filter:none;backdrop-filter:none;background-color:var(--sheet2)}

/* index + lists */
.rows{border-top:1px solid var(--rule);margin-top:6px}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:16px 0;border-bottom:1px solid var(--rule)}
.card b{display:block;font-weight:700;letter-spacing:-.015em;font-size:19px}
.card small,.cat small{display:block;color:var(--graphite);font-size:14px;margin-top:2px;font-weight:400}
small.amber{color:var(--amber)}small.bad{color:var(--red)}
.n{font-size:18px;font-weight:700;color:var(--graphite)}.n.zero{color:var(--faint)}
.due{font-size:14px;font-weight:700;white-space:nowrap;color:var(--graphite)}
.due.amber{color:var(--amber)}.due.bad{color:var(--red)}
.card:active{opacity:.55}
.go{width:18px;height:18px;flex:none;fill:none;stroke:var(--graphite);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.panel{border-radius:22px;padding:2px 16px;margin-top:8px}
.panel .card:last-child{border-bottom:0}
.panel .card b{font-size:18px}

/* category slabs */
.slabs{display:grid;gap:12px;margin-top:10px}
.cat{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px 14px 14px;border-radius:22px;transition:transform .12s}
.cat:active{transform:scale(.985)}
.cat .tx{flex:1;min-width:0}
.cat b{display:block;font-weight:700;letter-spacing:-.015em;font-size:20px;color:var(--cink,var(--ink))}
.cat small{color:var(--csub,var(--graphite))}
.cat small.bad{color:var(--credS,var(--red))}.cat small.amber{color:var(--camberS,var(--amber))}
.cat .n{color:var(--csub,var(--graphite))}.cat .n.zero{color:var(--csub,var(--faint));opacity:.8}
.cat .go{stroke:var(--csub,var(--graphite))}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--ctile,var(--sheet2));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hl),0 2px 6px rgba(0,0,0,.08)}
.ico.sm{width:38px;height:38px;border-radius:12px}
.ico svg{width:24px;height:24px;fill:none;stroke:var(--cink,var(--ink));stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm svg{width:20px;height:20px}
/* Midnight: tonal stacked pills */
:root[data-theme=midnight] .slabs{gap:0;margin-top:14px}
:root[data-theme=midnight] .cat{align-items:flex-start;min-height:106px;padding:18px 24px 38px 20px;border-radius:999px;
  background-color:var(--cbg);background-image:linear-gradient(165deg,rgba(255,255,255,.13),rgba(255,255,255,0) 52%);
  border:1px solid rgba(204,208,207,.10);-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 -12px 26px rgba(0,0,0,.30),0 18px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16)}
:root[data-theme=midnight] .cat+.cat{margin-top:-28px}
:root[data-theme=midnight] .cat:last-child{padding-bottom:20px}
:root[data-theme=midnight] .cat .n{margin-top:11px}
:root[data-theme=midnight] .cat .go{margin-top:14px}
:root[data-theme=midnight] .ico{border-color:transparent;box-shadow:none}
:root[data-theme=midnight] .cat.t0{--cbg:#253745;--cink:#ccd0cf;--csub:#9ba8ab;--credS:#ff9a8f;--camberS:#f2b866;--ctile:rgba(204,208,207,.12)}
:root[data-theme=midnight] .cat.t1{--cbg:#4a5c6a;--cink:#eef0ef;--csub:#e0e4e3;--credS:#ffd6d1;--camberS:#ffe3b3;--ctile:rgba(255,255,255,.16)}
:root[data-theme=midnight] .cat.t2{--cbg:#9ba8ab;--cink:#06141b;--csub:#1a2f3c;--credS:#651008;--camberS:#523000;--ctile:rgba(6,20,27,.10)}
:root[data-theme=midnight] .cat.t3{--cbg:#ccd0cf;--cink:#06141b;--csub:#253745;--credS:#8f1d12;--camberS:#7a4300;--ctile:rgba(6,20,27,.08)}

/* highlighter + datasheet */
.mark{font-style:normal;color:var(--markink);cursor:pointer;padding:.04em .4em;margin-left:-.4em;border-radius:.3em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(104deg,rgba(var(--mark),0) .9%,rgba(var(--mark),var(--mk1)) 2.4%,rgba(var(--mark),var(--mk2)) 6%,rgba(var(--mark),var(--mk3)) 94%,rgba(var(--mark),0) 97%) no-repeat;background-size:100% 100%}
.mark.sweep{animation:sweep .55s cubic-bezier(.2,.7,.2,1)}
@keyframes sweep{from{background-size:0% 100%}to{background-size:100% 100%}}
.keys{border-top:1px solid var(--rule);margin-top:18px}
.key{padding:16px 0 14px;border-bottom:1px solid var(--rule)}
.key .k,.fr .k,.pk span,.ck span{display:block;color:var(--graphite);font-size:14px}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px}
.kv .mark{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.35;word-break:break-word;min-width:0}
.acts{flex:none;padding-top:3px}
.act{position:relative;display:inline-block;font-size:14px;font-weight:700;line-height:1.3;border-radius:99px;padding:6px 14px;color:var(--ink);text-decoration:none;cursor:pointer;text-align:center}
.act::after{content:"";position:absolute;inset:-8px -5px}
.act:active,.btn:active,.fab:active,.chip:active,.tool:active,.round:active,.tab:active{transform:scale(.97)}
.tools{display:flex;gap:10px;margin-top:16px}
.tool{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 10px;border-radius:999px;font-weight:700;font-size:14px;text-align:center;white-space:nowrap}
.tool svg{width:19px;height:19px}
.facts{margin-top:8px}
.fact{display:grid;grid-template-columns:42% 1fr;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.fact span{color:var(--graphite);font-size:15px}
.fact b{font-weight:700;word-break:break-word}
.fact a{font-weight:700;word-break:break-word;text-decoration:underline;text-decoration-color:rgba(var(--mark),1);text-decoration-thickness:3px;text-underline-offset:3px}
details{border-bottom:1px solid var(--rule)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:700;font-size:17px;cursor:pointer;min-height:52px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;margin-right:4px;border-right:2px solid var(--graphite);border-bottom:2px solid var(--graphite);transform:rotate(-45deg);transition:transform .18s}
details[open] summary::after{transform:rotate(45deg)}
details ul{margin:0 0 14px 20px}details li{margin:6px 0}

/* search facts, pinned, counter */
.fr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.fr .tx{flex:1;min-width:0;cursor:pointer}
.fr .mark{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.5;word-break:break-word}
.fr small{display:block;color:var(--graphite);font-size:14px;margin-top:2px}
.pins{display:grid;gap:12px;margin-top:8px}
.pin{border-radius:26px;padding:16px 18px;cursor:pointer}
.pt b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.pt small{display:block;color:var(--graphite);font-size:14px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.pk .mark{font-size:20px;font-weight:700;line-height:1.5;word-break:break-word}
.counter{padding-top:max(14px,env(safe-area-inset-top))}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ctitle{font-weight:700;font-size:17px;color:var(--graphite)}
.ck{padding:26px 0 22px;border-bottom:1px solid var(--rule);cursor:pointer}
.ck .mark{display:inline;font-size:clamp(30px,10vw,46px);font-weight:700;letter-spacing:-.025em;line-height:1.4;word-break:break-word}
.hint{font-size:13px;color:var(--graphite);margin-top:8px}

/* renewals + settings */
.sum{padding:16px 18px}
.sum b{display:block;font-size:20px;letter-spacing:-.015em}
.sum span{display:block;margin-top:4px}
.sum small{display:block;color:var(--graphite);font-size:13px;margin-top:6px}
.seg{display:flex;gap:6px;padding:5px;border-radius:999px;margin-top:8px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:700;text-align:center;color:var(--graphite)}
.seg button.on{background:var(--inkglass);color:var(--onink)}
.srow{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
.srow span{color:var(--graphite)}.srow b{text-align:right}

/* actions */
.btn{width:100%;height:52px;border-radius:15px;font-weight:700;margin-top:14px;text-align:center;background:var(--inkglass);color:var(--onink);
  box-shadow:var(--btnshadow),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
a.btn{display:grid;place-items:center;text-decoration:none}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--ink);box-shadow:none}
.btn.danger{color:var(--red);border-color:var(--rule)}
.btns{display:flex;gap:12px;margin-top:26px}.btns .btn{margin-top:0}
.fab{position:fixed;right:max(22px,calc(50% - 258px));bottom:max(24px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;text-align:center;font-size:30px;line-height:1;color:var(--onink);background:var(--inkglass);border:1px solid rgba(255,255,255,.18);
  box-shadow:var(--btnshadow),inset 0 1px 0 rgba(255,255,255,.2)}
.fab.up{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 80px)}

/* tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:6;width:min(calc(100% - 36px),400px);height:66px;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px}
.tab{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--graphite);text-align:center}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--inkglass);color:var(--onink)}
.tabs{background-color:var(--tabbg)}

/* add form */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.chip{min-height:44px;padding:0 18px;border-radius:99px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;text-align:center}
.chip.on{background:var(--inkglass);color:var(--onink);border-color:transparent}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:1em}
.form .lbl{margin:26px 0 8px}

/* add + preview */
.steps{list-style:none;counter-reset:s;margin:14px 0 4px;padding:0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--graphite);font-size:15px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--inkglass);color:var(--onink);flex:none}
.btn.big{height:62px;border-radius:20px;font-size:18px;margin-top:18px}
.or{text-align:center;color:var(--graphite);font-size:14px;margin:14px 0 0}
.pastebox{margin-top:12px}
.pastebox textarea{margin-top:4px}
.star{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--graphite);flex:none}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.star.on{color:var(--markink);background:rgb(var(--mark))}
.star.on svg{fill:currentColor}
.star:active{transform:scale(.94)}
.fact.pv{grid-template-columns:38% 1fr 44px;align-items:center;cursor:default;padding:6px 0 6px}
.fact.pv span{font-size:15px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:12px 22px max(14px,env(safe-area-inset-bottom));background:var(--tabbg);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border-top:1px solid var(--rule)}
.savebar div{max-width:516px;margin:0 auto}
.savebar .btn{margin-top:0}
.pvnote{margin-top:6px}

/* empty, login, toast */
.empty{padding:36px 0;color:var(--graphite)}
.empty .btn{max-width:260px}
.login{min-height:80vh;display:grid;place-items:center}
.login .panel{width:100%;max-width:380px;padding:34px 26px;text-align:center;border-radius:28px}
.login .title{margin-top:0}.login .btn{margin-top:26px}
#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(12px);background:var(--inkglass);color:var(--onink);padding:9px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}

button:focus-visible,summary:focus-visible,a:focus-visible,.pin:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ---------- CONFIG ---------- */
/* Storage keys stay 'docbrief.*' so anything saved before the rename is kept. */
const FIREBASE_CONFIG = { apiKey: "", authDomain: "", projectId: "", appId: "" };
const USE_CLOUD = !!FIREBASE_CONFIG.apiKey;

/* ---------- THEME ---------- */
const getTheme = () => document.documentElement.dataset.theme === 'paper' ? 'paper' : 'midnight';
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('docbrief.theme', t); } catch(e) {}
  const m = document.getElementById('themeColor'); if(m) m.content = t === 'paper' ? '#f8f9fb' : '#06141b';
}
setTheme(getTheme());

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const str = v => v == null ? '' : String(v).trim();
const LABELS = { insurance:'Insurance', finance:'Finance', home:'Home & warranties' };
const label = t => LABELS[t] || (t ? t[0].toUpperCase() + t.slice(1) : 'Other');
const DEFAULT_CATS = ['insurance', 'finance', 'home'];
const enc = t => esc(encodeURIComponent(t));
const safeDecode = s => { try { return decodeURIComponent(s); } catch { return s; } };
const cats = () => [...new Set([...DEFAULT_CATS, ...docs.map(d => d.type).sort()])];
const daysLeft = iso => Math.round((new Date(iso + 'T00:00:00') - new Date().setHours(0,0,0,0)) / 864e5);
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
const fmtMonth = key => new Date(key + '-01T00:00:00').toLocaleDateString('en-IN', {month:'long', year:'numeric'});
const isPhone = v => /^\+?[\d\s\-()]{7,}$/.test(v);
const isMail = v => /^\S+@\S+\.\S+$/.test(v);
function due(d){
  if(!d.expiry) return null;
  const n = daysLeft(d.expiry);
  if(n < 0) return {cls:'bad', text:'Expired'};
  if(n === 0) return {cls:'bad', text:'Ends today'};
  if(n <= 30) return {cls:'bad', text: n + (n === 1 ? ' day left' : ' days left')};
  if(n <= 90) return {cls:'amber', text: n + ' days left'};
  return {cls:'', text:'Ends ' + fmtDate(d.expiry)};

function buildPrompt(mode){
  const list = cats().map(c => c === 'home' ? 'home (home & warranties)' : c).join(', ');
  const body = `Read the attached document and extract only what a person might need in a hurry. Reply with ONE JSON object and nothing else (no markdown, no commentary).

{"type":"","title":"","provider":"","expiry":"YYYY-MM-DD (renewal/end date, or empty)","fields":[{"label":"","value":"","key":true}],"sections":[{"title":"e.g. Covered / Not covered / How to claim / Key terms","items":[""]}],"contacts":[{"label":"","value":"","key":true}],"notes":""}`;

const ALIASES = {warranty:'home', warranties:'home', 'home & warranties':'home', 'home and warranties':'home', property:'home', appliance:'home', loan:'finance', bank:'finance', banking:'finance', investment:'finance', 'health insurance':'insurance', 'life insurance':'insurance', 'motor insurance':'insurance'};
function resolveType(t){
  t = str(t).toLowerCase(); if(!t) return 'other';
  if(ALIASES[t]) return ALIASES[t];
  return cats().find(c => c === t || c + 's' === t || c === t + 's' || label(c).toLowerCase() === t) || t;
}
function parseLoose(s){
  s = String(s).trim(); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b < a) throw Error("No JSON found. Paste Claude's full reply.");
  try { return JSON.parse(s.slice(a, b + 1)); } catch { throw Error('Invalid JSON. Ask Claude to reply with JSON only.'); }
}
function pairs(v){
  if(!v) return [];

let docs = [], user = null, store = null, ready = false, unsub = null;
function localStore(){
  const K = 'docbrief.docs', read = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch { return []; } };
  const write = a => { localStorage.setItem(K, JSON.stringify(a)); docs = a; render(); };
  docs = read();
  return { save: async d => write(read().filter(x => x.id !== d.id).concat(d)), remove: async id => write(read().filter(x => x.id !== id)) };
}
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
async function initStore(){
  if(!USE_CLOUD){ store = localStore(); ready = true; render(); return; }
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(base + 'firebase-app-compat.js');
  await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});
  firebase.auth().onAuthStateChanged(u => {
    if(unsub){ unsub(); unsub = null; }
    ready = true; user = u;
    if(!u){ docs = []; store = null; render(); return; }
    const col = db.collection('users').doc(u.uid).collection('docs');
    // Writes land in the local cache at once and upload when online, so never wait on the server promise.
    store = {
      save: d => { col.doc(d.id).set(JSON.parse(JSON.stringify(d))).catch(e => toast(e.message)); return Promise.resolve(); },
      remove: id => { col.doc(id).delete().catch(e => toast(e.message)); return Promise.resolve(); }
    };
    unsub = col.onSnapshot(s => { docs = s.docs.map(x => x.data()); render(); }, e => toast(e.message));
  });
}
async function signIn(){
  const p = new firebase.auth.GoogleAuthProvider();
  try { await firebase.auth().signInWithPopup(p); }
  catch(e){
    const c = e && e.code;
    if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    if(c === 'auth/unauthorized-domain') return toast('Add this site under Authentication > Settings > Authorized domains');
    if(c === 'auth/operation-not-allowed') return toast('Turn on Google sign-in in Firebase');
    if(c === 'auth/network-request-failed') return toast('No connection. Try again online');
    firebase.auth().signInWithRedirect(p);

function split(d){
  const all = [...d.fields.map(f => ({...f, kind:'f'})), ...d.contacts.map(c => ({...c, kind:'c'}))];
  let keys = all.filter(x => x.key).slice(0, 3);
  if(!keys.length) keys = d.fields.slice(0, 3).map(f => ({...f, kind:'f'}));
  const id = x => x.kind + '|' + x.label + '|' + x.value, set = new Set(keys.map(id));
  return { keys,
    rest: d.fields.filter(f => !set.has(id({...f, kind:'f'}))),
    contacts: d.contacts.filter(c => !set.has(id({...c, kind:'c'}))) };
}
function factIndex(){
  const out = [];
  for(const d of docs){
    d.fields.forEach(f => out.push({label:f.label, value:f.value, doc:d, key:f.key}));
    d.contacts.forEach(c => out.push({label:c.label, value:c.value, doc:d, key:c.key}));
    if(d.expiry) out.push({label:'Renewal date', value:fmtDate(d.expiry), doc:d, key:false});
  }
  return out;
}
function factMatches(words){
  if(!words.length) return [];
  return factIndex().filter(x => {
    const core = (x.label + ' ' + x.value).toLowerCase();
    const ctx = core + ' ' + (x.doc.title + ' ' + (x.doc.provider || '') + ' ' + label(x.doc.type)).toLowerCase();
    return words.every(w => ctx.includes(w)) && words.some(w => core.includes(w));
  }).sort((a, b) => (b.key ? 1 : 0) - (a.key ? 1 : 0)).slice(0, 12);
}
function quickTerms(){
  if(!docs.length) return [];
  const cnt = new Map();
  docs.forEach(d => [...d.fields, ...d.contacts].forEach(f => { if(f.key){ cnt.set(f.label, (cnt.get(f.label) || 0) + 1); } }));
  const top = [...cnt.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 3);
  if(docs.some(d => d.expiry)) top.push('Renewal date');
  return top;
}
function annualPremium(d){
  const f = d.fields.find(x => /premium/i.test(x.label)); if(!f) return 0;
  const m = f.value.replace(/,/g, '').match(/(\d+(?:\.\d+)?)/); if(!m) return 0;
  return /(year|annual|yr|p\.?a)/i.test(f.value) ? parseFloat(m[1]) : 0;
}
const localDocs = () => { try { const a = JSON.parse(localStorage.getItem('docbrief.docs')); return Array.isArray(a) ? a : []; } catch { return []; } };
async function migrateLocal(){
  const arr = localDocs(); let n = 0;
  for(const x of arr){
    if(!x || !x.id || docs.some(d => d.id === x.id)) continue;
    try { const o = normalize(x, str(x.type).toLowerCase() || 'other'); o.id = x.id; o.updated = Number(x.updated) || Date.now(); if(x.pinned) o.pinned = true; await store.save(o); n++; } catch(e) {}
  }
  try { localStorage.setItem('docbrief.docs.moved', localStorage.getItem('docbrief.docs') || '[]'); localStorage.removeItem('docbrief.docs'); } catch(e) {}
  toast(n ? 'Moved ' + n + (n === 1 ? ' document' : ' documents') : 'Already in your account');
  render();
}
const ymd = dt => dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, '0') + String(dt.getDate()).padStart(2, '0');
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function fold(line){ const out = []; while(line.length > 73){ out.push(line.slice(0, 73)); line = ' ' + line.slice(73); } out.push(line); return out.join('\r\n'); }
function buildIcs(d){
  if(!d.expiry) return '';
  const today = new Date().setHours(0, 0, 0, 0), end = new Date(d.expiry + 'T00:00:00');
  const events = [30, 7, 0].map(n => { const day = new Date(end); day.setDate(day.getDate() - n); return {n, day}; }).filter(e => e.day.getTime() >= today);
  if(!events.length) return '';
  const info = split(d).keys.map(k => k.label + ': ' + k.value).join('\n') + (d.provider ? '\nProvider: ' + d.provider : '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sumry//EN', 'CALSCALE:GREGORIAN'];
  events.forEach(e => {
    const next = new Date(e.day); next.setDate(next.getDate() + 1);
    L.push('BEGIN:VEVENT', 'UID:' + d.id + '-' + e.n + '@docbrief', 'DTSTAMP:' + stamp,
      'DTSTART;VALUE=DATE:' + ymd(e.day), 'DTEND;VALUE=DATE:' + ymd(next),
      'SUMMARY:' + icsEsc(e.n === 0 ? 'Ends today: ' + d.title : 'Renews in ' + e.n + ' days: ' + d.title),
      'DESCRIPTION:' + icsEsc('Ends ' + fmtDate(d.expiry) + '\n' + info),
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Sumry reminder', 'TRIGGER;RELATED=START:PT9H', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n');
}
function download(name, type, text){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function downloadIcs(d){
  const ics = buildIcs(d);
  if(!ics){ toast('The renewal date has passed'); return; }
  download((d.title.replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'renewal') + '.ics', 'text/calendar', ics);

}

  const list = docs.filter(d => d.type === t).sort(byDate);

    <h1 class="title">${esc(label(t))}</h1><p class="sub">${plural(list.length)}</p>
    ${list.length ? `<div class="rows" style="margin-top:18px">${list.map(d => cardHtml(d, false)).join('')}</div>` : `<div class="empty"><p>No ${esc(label(t).toLowerCase())} documents yet.</p><button class="btn" data-a="go" data-h="#/add/${enc(t)}">Add document</button></div>`}
    ${list.length ? `<button class="fab" data-a="go" data-h="#/add/${enc(t)}" aria-label="Add document">+</button>` : ''}`;
}
function keyHtml(k){
  return `<div class="key"><span class="k">${esc(k.label)}</span><div class="kv"><i class="mark" data-a="copy" data-v="${esc(k.value)}">${esc(k.value)}</i><span class="acts">${actHtml(k.value)}</span></div></div>`;
}
function contactRow(c){
  const v = c.value;
  const val = isPhone(v) ? `<a href="tel:${esc(v.replace(/[^\d+]/g, ''))}">${esc(v)}</a>` : isMail(v) ? `<a href="mailto:${esc(v)}">${esc(v)}</a>` : `<b data-a="copy" data-v="${esc(v)}">${esc(v)}</b>`;
  return `<div class="fact ct"><span>${esc(c.label)}</span>${val}</div>`;
}
function detailView(id){
  const d = docs.find(x => x.id === id);
  if(!d) return `<div class="bar">${back('#/', 'Home')}</div><p class="empty">This document is no longer here.</p>`;
  const { keys, rest, contacts } = split(d), x = due(d);
  const pinBtn = `<button class="round ${d.pinned ? 'on' : ''}" data-a="pin" data-id="${esc(d.id)}" aria-pressed="${d.pinned ? 'true' : 'false'}" aria-label="${d.pinned ? 'Unpin from home' : 'Pin to home'}">${PIN}</button>`;
  return `<div class="bar">${back('#/c/' + enc(d.type), label(d.type))}<span class="bar-r">${pinBtn}${x ? `<span class="stat ${x.cls}">${esc(x.text)}</span>` : ''}</span></div>
    <h1 class="title sm">${esc(d.title)}</h1>${d.provider ? `<p class="sub">${esc(d.provider)}</p>` : ''}
    ${keys.length ? `<div class="keys">${keys.map(keyHtml).join('')}</div>` : ''}
    ${keys.length || d.expiry ? `<div class="tools">${keys.length ? `<button class="tool" data-a="go" data-h="#/show/${esc(d.id)}">${EYE}<span>Show at counter</span></button>` : ''}${d.expiry ? `<button class="tool" data-a="ics" data-id="${esc(d.id)}">${BELL}<span>Remind me</span></button>` : ''}</div>` : ''}
    ${rest.length ? `<div class="facts" style="margin-top:14px">${rest.map(f => `<button class="fact" data-a="copy" data-v="${esc(f.value)}"><span>${esc(f.label)}</span><b>${esc(f.value)}</b></button>`).join('')}</div>` : ''}
    ${d.sections.map((s, i) => `<details ${i === 0 ? 'open' : ''}><summary>${esc(s.title)}</summary><ul>${s.items.map(it => `<li>${esc(it)}</li>`).join('')}</ul></details>`).join('')}
    ${contacts.length ? `<div class="lbl">Contacts</div><div class="facts">${contacts.map(contactRow).join('')}</div>` : ''}
    ${d.notes ? `<div class="lbl">Notes</div><p>${esc(d.notes)}</p>` : ''}
    ${d.link ? `<a class="btn o" href="${esc(d.link)}" target="_blank" rel="noopener" style="margin-top:22px">Open original document</a>` : ''}
    <div class="btns"><button class="btn o" data-a="go" data-h="#/edit/${esc(d.id)}">Edit details</button><button class="btn o danger" data-a="del" data-id="${esc(d.id)}">Delete</button></div>`;
}
function counterView(id){
  const d = docs.find(x => x.id === id);
  if(!d) return `<div class="bar">${back('#/', 'Home')}</div><p class="empty">This document is no longer here.</p>`;
  const { keys } = split(d);
  return `<div class="counter"><div class="ctop"><span class="ctitle">${esc(d.title)}</span><button class="round" data-a="go" data-h="#/d/${esc(d.id)}" aria-label="Close">${CLOSE}</button></div>
    ${keys.map(k => `<div class="ck" data-a="copy" data-v="${esc(k.value)}"><span>${esc(k.label)}</span><i class="mark">${esc(k.value)}</i></div>`).join('')}
    <p class="hint">Tap a value to copy it. The screen stays on while this is open.</p></div>`;
}
function renewalsView(){
  const dated = docs.filter(d => d.expiry).sort((a, b) => a.expiry.localeCompare(b.expiry));
  const over = dated.filter(d => daysLeft(d.expiry) < 0);
  const next = dated.filter(d => { const n = daysLeft(d.expiry); return n >= 0 && n <= 365; });
  const later = dated.filter(d => daysLeft(d.expiry) > 365);
  const months = [];
  next.forEach(d => { const k = d.expiry.slice(0, 7); let g = months.find(m => m.k === k); if(!g){ g = {k, list:[]}; months.push(g); } g.list.push(d); });
  const total = next.reduce((s, d) => s + annualPremium(d), 0), undated = docs.length - dated.length;
  const sum = `<div class="panel sum"><b>${next.length} ${next.length === 1 ? 'renewal' : 'renewals'} in the next 12 months</b>${total ? `<span>About ₹${Math.round(total).toLocaleString('en-IN')} in yearly premiums</span><small>Read from the premium fields. Check each one before you pay.</small>` : ''}</div>`;
  const body = !dated.length ? '<p class="empty">No renewal dates yet. Documents with an end date show up here.</p>'
    : sum
      + (over.length ? `<div class="lbl bad">Expired</div><div class="rows">${over.map(d => cardHtml(d)).join('')}</div>` : '')
      + months.map(g => `<div class="lbl">${esc(fmtMonth(g.k))}</div><div class="rows">${g.list.map(d => cardHtml(d)).join('')}</div>`).join('')
      + (later.length ? `<div class="lbl">Later</div><div class="rows">${later.map(d => cardHtml(d)).join('')}</div>` : '')
      + (undated ? `<p class="hint" style="margin-top:22px">${plural(undated)} without an end date ${undated === 1 ? 'is' : 'are'} not shown.</p>` : '');
  return `<div class="bar"><span></span><span></span></div><h1 class="title">Renewals</h1><p class="sub">Next 12 months</p>${body}${tabbar('renewals')}`;
}
function settingsView(){
  const t = getTheme();
  const sw = ('serviceWorker' in navigator && navigator.serviceWorker.controller) ? 'Ready. Opens without a connection.'
    : location.protocol === 'file:' ? 'Not available when opened as a file.' : 'Setting up. Open the app once more online.';
  return `<div class="bar"><span></span><span></span></div><h1 class="title">Settings</h1>
    <div class="lbl">Appearance</div>
    <div class="seg" role="group" aria-label="Theme"><button class="${t === 'paper' ? 'on' : ''}" data-a="theme" data-k="paper" aria-pressed="${t === 'paper'}">Paper</button><button class="${t === 'midnight' ? 'on' : ''}" data-a="theme" data-k="midnight" aria-pressed="${t === 'midnight'}">Midnight</button></div>
    <div class="lbl">Storage</div>
    <div class="srow"><span>Sync</span><b>${USE_CLOUD ? 'Google account' : 'This browser only'}</b></div>
    ${USE_CLOUD && user ? `<div class="srow"><span>Signed in as</span><b>${esc(user.email || user.displayName || '')}</b></div>` : ''}
    <div class="srow"><span>Offline</span><b>${esc(sw)}</b></div>
    <div class="srow"><span>Documents</span><b>${docs.length}</b></div>
    <div class="lbl">Backup</div>
    <div class="tools" style="margin-top:8px"><button class="tool" data-a="export">Export</button><button class="tool" data-a="importbtn">Import</button></div>
    <input type="file" id="importfile" accept=".json,application/json,text/plain" hidden>
    ${USE_CLOUD ? '' : '<p class="hint">Your documents live on this device only. Export a backup now and then.</p>'}
    ${USE_CLOUD && user ? `<button class="btn o" data-a="signout" style="margin-top:22px">Sign out</button>` : ''}
    <p class="hint" style="margin-top:22px">Sumry v7</p>${tabbar('settings')}`;
}
function addView(){
  const s = addState; if(!s){ location.hash = '#/'; return ''; }
  if(s.mode === 'edit') return `<div class="bar">${back('#/d/' + esc(s.id), 'Back')}</div>
    <h1 class="title sm">Edit details</h1>
    <div class="form"><div class="lbl">Details (JSON)</div>
    <textarea class="inp area" id="json" placeholder="{ … }" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(s.json)}</textarea>
    <p class="err" id="err"></p><button class="btn" data-a="save">Save</button></div>`;
  return `<div class="bar">${back(s.from ? '#/c/' + enc(s.from) : '#/', 'Back')}</div>
    <h1 class="title sm">Add document</h1>
    <ol class="steps"><li>Upload the document to Claude</li><li>Copy Claude's reply</li><li>Paste it here</li></ol>
    <button class="btn big" data-a="paste">Paste from clipboard</button>
    <button class="btn o" data-a="pickfile">Choose a file instead</button>
    <input type="file" id="file" accept=".json,.txt,application/json,text/plain" hidden>
    <details class="pastebox" id="pastebox"><summary>Paste text instead</summary>
      <textarea class="inp area" id="json" placeholder="Paste Claude's reply here" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(s.json)}</textarea>
      <button class="btn" data-a="preview">Preview</button></details>
    <p class="err" id="err"></p>
    <details><summary>One-time setup: skip the prompt</summary>
      <ol class="steps"><li>In Claude, create a Project</li><li>Paste these instructions into it</li><li>Upload documents inside that Project</li></ol>
      <button class="btn o" data-a="projprompt" style="margin-top:6px">Copy Project instructions</button>
      <button class="btn o" data-a="prompt">Copy a one-off prompt</button></details>`;
}
function previewView(){
  const s = addState;
  if(!s || s.mode !== 'add' || !s.draft){ location.hash = '#/add'; return ''; }
  const d = s.draft, types = cats();
  if(!s.custom && !types.includes(s.type)) types.push(s.type);
  const star = (ref, on, lbl) => `<button class="star ${on ? 'on' : ''}" data-a="star" data-ref="${ref}" aria-pressed="${on ? 'true' : 'false'}" aria-label="${on ? 'Remove highlight from' : 'Highlight'} ${esc(lbl)}">${STAR}</button>`;
  const all = [...d.fields.map((x, i) => ({...x, ref:'f' + i})), ...d.contacts.map((x, i) => ({...x, ref:'c' + i}))];
  const keys = all.filter(x => x.key), fields = all.filter(x => !x.key && x.ref[0] === 'f'), contacts = all.filter(x => !x.key && x.ref[0] === 'c');
  const row = x => `<div class="fact pv"><span>${esc(x.label)}</span><b>${esc(x.value)}</b>${star(x.ref, false, x.label)}</div>`;
  return `<div class="bar">${back('#/add' + (s.from ? '/' + enc(s.from) : ''), 'Back')}<span class="stat">Preview</span></div>
    <h1 class="title sm">${esc(d.title)}</h1>${d.provider ? `<p class="sub">${esc(d.provider)}</p>` : ''}${d.expiry ? `<p class="sub pvnote">Ends ${esc(fmtDate(d.expiry))}</p>` : ''}
    <div class="lbl">Category</div>
    <div class="chips">${types.map(t => `<button class="chip ${!s.custom && s.type === t ? 'on' : ''}" data-a="type" data-k="${esc(t)}">${esc(label(t))}</button>`).join('')}<button class="chip ${s.custom ? 'on' : ''}" data-a="newtype">+ New</button></div>
    ${s.custom ? `<input class="inp" id="cname" style="margin-top:12px" placeholder="Category name, e.g. Vehicle" value="${esc(s.customName)}" autocapitalize="none">` : ''}
    <div class="lbl">Highlights</div><p class="hint" style="margin-top:0">Tap a star to choose up to 3.</p>
    <div class="keys">${keys.length ? keys.map(k => `<div class="key"><span class="k">${esc(k.label)}</span><div class="kv"><i class="mark">${esc(k.value)}</i><span class="acts">${star(k.ref, true, k.label)}</span></div></div>`).join('') : '<p class="hint" style="padding:14px 0">Nothing highlighted yet. Tap a star below.</p>'}</div>
    ${fields.length ? `<div class="facts" style="margin-top:14px">${fields.map(row).join('')}</div>` : ''}
    ${d.sections.map((x, i) => `<details ${i === 0 ? 'open' : ''}><summary>${esc(x.title)}</summary><ul>${x.items.map(it => `<li>${esc(it)}</li>`).join('')}</ul></details>`).join('')}
    ${contacts.length ? `<div class="lbl">Contacts</div><div class="facts">${contacts.map(row).join('')}</div>` : ''}
    ${d.notes ? `<div class="lbl">Notes</div><p>${esc(d.notes)}</p>` : ''}
    <div class="lbl">Link to original (optional)</div><input class="inp" id="link" type="url" inputmode="url" autocapitalize="none" placeholder="https://drive.google.com/…" value="${esc(s.link)}">
    <p class="err" id="err"></p>
    <div class="savebar"><div><button class="btn" data-a="save">Save to Sumry</button></div></div>`;
}
function startPreview(){
  const s = addState, err = $('#err');
  try {
    const d = normalize(s.json);
    const all = [...d.fields, ...d.contacts];
    let pick = all.filter(x => x.key);
    if(!pick.length) pick = d.fields.slice(0, 3);
    all.forEach(x => { x.key = false; });
    pick.slice(0, 3).forEach(x => { x.key = true; });
    s.draft = d; s.type = s.from || resolveType(d.type); s.custom = false; s.customName = ''; s.returning = true;
    location.hash = '#/preview';
  } catch(ex){ if(err) err.textContent = ex.message; else toast(ex.message); }
}
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(f); });
async function importBackup(text){
  let o; try { o = JSON.parse(text); } catch { try { o = parseLoose(text); } catch(e){ toast(e.message); return; } }
  const arr = Array.isArray(o) ? o : Array.isArray(o.docs) ? o.docs : null;
  if(!arr){ addState = {mode:'add', from:'', type:'', json:text, link:'', draft:null, custom:false, customName:''}; startPreview(); return; }
  let n = 0;
  for(const x of arr){
    try { const d = normalize(x, str(x.type).toLowerCase() || 'other'); d.id = str(x.id) || uid(); d.updated = Number(x.updated) || Date.now(); if(x.pinned) d.pinned = true; await store.save(d); n++; } catch(e) {}
  }
  toast(n ? 'Imported ' + n + (n === 1 ? ' document' : ' documents') : 'Nothing to import');
}

/* ---------- ROUTER ---------- */
function exportDoc(d){
  const { id, updated, pinned, ...rest } = d;
  const strip = a => a.map(x => x.key ? x : { label: x.label, value: x.value });
  return { ...rest, fields: strip(rest.fields), contacts: strip(rest.contacts) };
}
function routeEnter(){
  const h = location.hash; let m;
  if(m = h.match(/^#\/add(?:\/(.+))?$/)){
    const from = m[1] ? safeDecode(m[1]) : '';
    if(addState && addState.mode === 'add' && addState.returning && addState.from === from){ addState.returning = false; return; }
    addState = {mode:'add', from, type: from, json:'', link:'', draft:null, custom:false, customName:''};
  }
  else if(m = h.match(/^#\/edit\/(.+)$/)){
    const d = docs.find(x => x.id === m[1]);
    addState = d ? {mode:'edit', id: d.id, json: JSON.stringify(exportDoc(d), null, 2), link:''} : null;
  }
  else if(h !== '#/preview' && addState && addState.mode === 'add') addState = null;
}
function render(){
  const app = $('#app'), h = location.hash || '#/';
  if(!ready){ app.innerHTML = '<p class="empty">Loading…</p>'; return; }
  if(USE_CLOUD && !user){ app.innerHTML = loginView(); releaseWake(); return; }
  let m, html;
  if(m = h.match(/^#\/d\/(.+)$/)) html = detailView(m[1]);
  else if(m = h.match(/^#\/c\/(.+)$/)) html = categoryView(safeDecode(m[1]));
  else if(m = h.match(/^#\/show\/(.+)$/)) html = counterView(m[1]);
  else if(h === '#/preview') html = previewView();
  else if(/^#\/(add|edit)(\/|$)/.test(h)) html = addView();
  else if(h === '#/renewals') html = renewalsView();
  else if(h === '#/settings') html = settingsView();
  else html = homeView();
  app.innerHTML = html;
  if(/^#\/show\//.test(h)) requestWake(); else releaseWake();
}
window.addEventListener('hashchange', () => { routeEnter(); render(); window.scrollTo(0, 0); });
window.addEventListener('scroll', () => document.body.classList.toggle('scrolled', window.scrollY > 6), {passive:true});

/* ---------- EVENTS ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ q = t.value; $('#homebody').innerHTML = homeBody(); }
  else if(addState){ if(t.id === 'json') addState.json = t.value; else if(t.id === 'link') addState.link = t.value; else if(t.id === 'cname') addState.customName = t.value; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches && e.target.matches('[role=button][data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('click', async e => {
  if(e.target.closest('a[href]')) return;
  const t = e.target.closest('[data-a]'); if(!t) return;
  const a = t.dataset.a;
  if(a === 'go') location.hash = t.dataset.h;
  else if(a === 'copy'){
    copy(t.dataset.v);
    const k = t.closest('.key,.fr,.pk,.ck'), m = k && k.querySelector('.mark');
    if(m){ m.classList.remove('sweep'); void m.offsetWidth; m.classList.add('sweep'); }
  }
  else if(a === 'q'){ q = t.dataset.v; render(); }
  else if(a === 'theme'){ setTheme(t.dataset.k); render(); }
  else if(a === 'theme-toggle'){ setTheme(getTheme() === 'paper' ? 'midnight' : 'paper'); render(); }
  else if(a === 'pin'){
    const d = docs.find(x => x.id === t.dataset.id);
    if(d){ await store.save({...d, pinned: !d.pinned}); toast(d.pinned ? 'Unpinned' : 'Pinned to home'); }
  }
  else if(a === 'ics'){ const d = docs.find(x => x.id === t.dataset.id); if(d) downloadIcs(d); }
  else if(a === 'type'){ addState.type = t.dataset.k; addState.custom = false; render(); }
  else if(a === 'newtype'){ addState.custom = true; render(); const c = $('#cname'); if(c) c.focus(); }
  else if(a === 'prompt') copy(buildPrompt());
  else if(a === 'projprompt') copy(buildPrompt('project'));
  else if(a === 'paste'){
    try {
      const txt = await navigator.clipboard.readText();
      if(!str(txt)) throw Error('empty');
      addState.json = txt; startPreview();
    } catch(ex){
      const box = $('#pastebox'); if(box){ box.open = true; const j = $('#json'); if(j) j.focus(); }
      toast('Paste into the box below');
    }
  }
  else if(a === 'preview') startPreview();
  else if(a === 'pickfile'){ const f = $('#file'); if(f) f.click(); }
  else if(a === 'star'){
    const d = addState.draft, ref = t.dataset.ref, item = (ref[0] === 'f' ? d.fields : d.contacts)[+ref.slice(1)];
    if(!item) return;
    if(!item.key && [...d.fields, ...d.contacts].filter(x => x.key).length >= 3){ toast('Up to 3 highlights. Remove one first.'); return; }
    item.key = !item.key;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  else if(a === 'export'){
    if(!docs.length){ toast('Nothing to back up yet'); return; }
    download('sumry-backup-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', JSON.stringify({app:'sumry', exported:new Date().toISOString(), docs}, null, 2));
    toast('Backup downloaded');
  }
  else if(a === 'importbtn'){ const f = $('#importfile'); if(f) f.click(); }
  else if(a === 'save'){
    const err = $('#err');
    try {
      const s = addState; let o;
      if(s.mode === 'edit'){
        o = normalize(s.json, null); o.id = s.id;
        const prev = docs.find(x => x.id === s.id); if(prev && prev.pinned) o.pinned = true;
      } else {
        const type = s.custom ? s.customName.trim().toLowerCase() : s.type;
        if(!type) throw Error('Name the category.');
        o = {...s.draft, type}; o.id = uid();
        const lk = s.link.trim(); if(lk) o.link = /^https?:\/\//.test(lk) ? lk : '';
      }
      o.updated = Date.now();
      await store.save(o); addState = null; toast('Saved'); location.hash = '#/d/' + o.id;
    } catch(ex){ if(err) err.textContent = ex.message; else toast(ex.message); }
  }
  else if(a === 'del'){
    if(confirm('Delete this document?')){
      const type = (docs.find(x => x.id === t.dataset.id) || {}).type;
      await store.remove(t.dataset.id);
      location.hash = type && docs.some(x => x.type === type && x.id !== t.dataset.id) ? '#/c/' + encodeURIComponent(type) : '#/';
    }
  }
  else if(a === 'sample'){ const o = normalize(SAMPLE, 'insurance'); o.id = uid(); o.updated = Date.now(); await store.save(o); }
  else if(a === 'signin') signIn();
  else if(a === 'migrate') await migrateLocal();
  else if(a === 'signout'){ if(confirm('Sign out?')) firebase.auth().signOut(); }
});

document.addEventListener('change', async e => {
  const t = e.target; if(!t.files || !t.files[0]) return;
  let text = '';
  try { text = await readFile(t.files[0]); } catch { toast('Could not read that file'); return; }
  try { t.value = ''; } catch(x) {}
  if(t.id === 'file' && addState){ addState.json = text; startPreview(); }
  else if(t.id === 'importfile') importBackup(text);
});

/* ---------- OFFLINE ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js' + (USE_CLOUD ? '?cloud=1' : '')).catch(() => {}); });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(location.hash === '#/settings') render(); });
}

routeEnter();
initStore().catch(e => { $('#app').innerHTML = '<p class="empty">Could not start: ' + esc(e.message || e) + '</p>'; });
</script>
</body>
</html>
